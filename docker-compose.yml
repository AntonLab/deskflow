# Локальная инфраструктура. Сервисы приложений добавляются сюда в модуле 9 (дни 56–57).
name: deskflow

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: deskflow
      POSTGRES_DB: deskflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deskflow -d deskflow']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: deskflow
      RABBITMQ_DEFAULT_PASS: deskflow
    ports:
      - '5672:5672'
      - '15672:15672' # веб-консоль: http://localhost:15672
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
